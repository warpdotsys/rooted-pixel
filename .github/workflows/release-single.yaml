name: 发布单设备 OTA

on:
  push:
    branches:
      - '*'
    paths:
      - rooted-ota.sh
      - .github/workflows/*.yaml
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - rooted-ota.sh
      - .github/workflows/*.yaml

  workflow_call:
    inputs:
      device-id:
        type: string
        default: 'shiba'
      ksu-kmi:
        type: string
        default: ''
      lenient-check:
        description: 宽松跳过（同 OTA 版本有任意 asset 就跳过）
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      device-id:
        description: 设备 ID（留空默认 shiba）
        required: false
        default: 'shiba'
      ksu-version:
        description: KernelSU 版本（留空则自动检测最新版）
        required: false
        default: ''
      ksu-kmi:
        description: KernelSU KMI（留空则自动检测）
        required: false
        default: ''
      skip-rootless:
        description: 跳过构建 rootless OTA
        type: boolean
        required: false
      skip-rooted:
        description: 跳过构建 rooted OTA
        type: boolean
        required: false
      upload-test-ota:
        description: 将 OTA 上传到 test 目录
        required: false
        type: boolean
      force-build:
        description: 强制重新构建（即使已存在）
        required: false
        type: boolean
      force-ota-server-upload:
        description: 强制上传到 OTA 服务器
        required: false
        type: boolean
      skip-release:
        description: 跳过发布（仅构建）
        required: false
        type: boolean
      ota-version:
        description: Pixel Build ID（如 AP4A.250205.002，留空自动检测）
        required: false
      magisk-version:
        description: Magisk 版本
        required: false

# 新 push 自动取消前一个正在运行的构建，避免资源浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.device-id || inputs.device-id || 'shiba' }}
  cancel-in-progress: true

jobs:
  build-device:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 恢复工具缓存
        id: cache-tools-restore
        uses: actions/cache/restore@v5
        with:
          path: .tool-cache
          key: tool-cache-${{ runner.os }}-v1

      - name: 预拉取 Docker 镜像
        run: |
          docker pull python:$(grep PYTHON_VERSION rooted-ota.sh | head -1 | cut -d: -f3 | tr -d " #'") 2>&1 | tail -1
          echo "Docker 镜像已缓存"

      - name: 设置输入参数
        run: |
          echo "DEVICE_ID=$(echo '${{ github.event.inputs.device-id || inputs.device-id || 'shiba' }}' | xargs)" >> $GITHUB_ENV
          KSU_VERSION='${{ github.event.inputs.ksu-version || '' }}'
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
          KSU_KMI='${{ github.event.inputs.ksu-kmi || inputs.ksu-kmi || '' }}'
          echo "KSU_KMI=$KSU_KMI" >> $GITHUB_ENV
          OTA_VERSION='${{ github.event.inputs.ota-version || inputs.ota-version || 'latest' }}'
          echo "OTA_VERSION=$OTA_VERSION" >> $GITHUB_ENV
          MAGISK_VERSION='${{ github.event.inputs.magisk-version || inputs.magisk-version || 'auto' }}'
          echo "MAGISK_VERSION=$MAGISK_VERSION" >> $GITHUB_ENV
          echo "SKIP_ROOTLESS=${{ github.event.inputs.skip-rootless || inputs.skip-rootless || 'false' }}" >> $GITHUB_ENV
          echo "UPLOAD_TEST_OTA=${{ github.event.inputs.upload-test-ota || inputs.upload-test-ota || 'false' }}" >> $GITHUB_ENV
          echo "FORCE_BUILD=${{ github.event.inputs.force-build || inputs.force-build || 'false' }}" >> $GITHUB_ENV
          echo "FORCE_OTA_SERVER_UPLOAD=${{ github.event.inputs.force-ota-server-upload || inputs.force-ota-server-upload || 'false' }}" >> $GITHUB_ENV
          echo "CHECK_LENIENT=${{ inputs.lenient-check || 'false' }}" >> $GITHUB_ENV
          echo "SKIP_RELEASE=${{ github.event.inputs.skip-release || '' }}" >> $GITHUB_ENV

          if [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "push/PR 事件：仅构建不发布"
            echo "FORCE_BUILD=true" >> $GITHUB_ENV
            echo "SKIP_RELEASE=true" >> $GITHUB_ENV
            echo "GITHUB_TOKEN=must-be-set-but-is-not-used" >> $GITHUB_ENV
          else
            echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV
          fi

      - name: 加载密钥
        run: |
          echo "PASSPHRASE_AVB=${{ secrets.PASSPHRASE_AVB }}" >> $GITHUB_ENV
          echo "PASSPHRASE_OTA=${{ secrets.PASSPHRASE_OTA }}" >> $GITHUB_ENV
          echo "KEY_AVB_BASE64=${{ secrets.KEY_AVB_BASE64 }}" >> $GITHUB_ENV
          echo "KEY_OTA_BASE64=${{ secrets.KEY_OTA_BASE64 }}" >> $GITHUB_ENV
          echo "CERT_OTA_BASE64=${{ secrets.CERT_OTA_BASE64 }}" >> $GITHUB_ENV

      - name: 构建 OTA（rootless + KernelSU + Magisk）
        env:
          GITHUB_REPO: ${{ github.repository }}
          PRESEED_OTA_DIR: /opt/actions-runner/_work/rooted-pixel/.ota-cache
          SKIP_CLEANUP: 'true'
        run: |
          source rooted-ota.sh
          if [[ $SKIP_RELEASE == 'true' ]]; then
            createRootedOta && createOtaServerData
          else
            createAndReleaseRootedOta
          fi

      - name: 保存工具缓存
        if: always()
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: .tool-cache
          key: tool-cache-${{ runner.os }}-v1

      - name: 验证产物存在
        run: |
          echo "=== .tmp 目录内容 ==="
          ls -la .tmp/ 2>/dev/null || echo ".tmp 不存在"
          echo ""
          echo "=== .tmp/*.zip 文件 ==="
          ls -lah .tmp/*.zip 2>/dev/null || echo "未找到 *.zip 文件"
          echo ""
          echo "=== 当前目录 ==="
          pwd
          echo ""
          echo "=== .tool-cache 内容 ==="
          ls -la .tool-cache/ 2>/dev/null | head -20 || echo ".tool-cache 不存在"

      - name: 准备上传目录
        if: always()
        run: |
          # 只复制本次构建实际生成的 OTA 产物，不按设备或版本写死。
          # 默认设备为 shiba 只在输入参数阶段处理；这里必须兼容任意 DEVICE_ID / OTA_VERSION。
          mkdir -p artifacts
          find .tmp -maxdepth 1 -type f -name '*.zip' \
            ! -name 'magisk-*.apk' \
            ! -name 'custota.zip' \
            -exec cp -v {} artifacts/ \; 2>/dev/null || true
          echo "=== 准备上传的文件 ==="
          ls -lah artifacts/*.zip 2>/dev/null || echo "无文件"

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DEVICE_ID }}-ota-artifacts
          path: |
            artifacts/*.zip
          if-no-files-found: warn
          retention-days: 30
