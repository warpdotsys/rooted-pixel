name: 自动构建多设备 OTA

on:
  schedule:
    # 每日 UTC 02:00 = 北京时间 10:00
    - cron: '0 2 * * *'

  workflow_dispatch:
    inputs:
      ksu-version:
        description: KernelSU 版本（留空则自动检测最新版）
        required: false
        default: ''
      ksu-kmi:
        description: KernelSU KMI（留空则自动检测）
        required: false
        default: ''
      force-build:
        description: 强制重新构建（即使已存在）
        type: boolean
        required: false
        default: false
      upload-test-ota:
        description: 上传到 test 目录
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-tokay:
    name: "tokay (Pixel 9)"
    uses: ./.github/workflows/release-single.yaml
    with:
      device-id: tokay
      ksu-kmi: ${{ (github.event_name == 'workflow_dispatch' && inputs.ksu-kmi) || '' }}
      lenient-check: true
    secrets: inherit

  build-caiman:
    name: "caiman (Pixel 9 Pro)"
    uses: ./.github/workflows/release-single.yaml
    with:
      device-id: caiman
      ksu-kmi: ${{ (github.event_name == 'workflow_dispatch' && inputs.ksu-kmi) || '' }}
      lenient-check: true
    secrets: inherit

  build-komodo:
    name: "komodo (Pixel 9 Pro XL)"
    uses: ./.github/workflows/release-single.yaml
    with:
      device-id: komodo
      ksu-kmi: ${{ (github.event_name == 'workflow_dispatch' && inputs.ksu-kmi) || '' }}
      lenient-check: true
    secrets: inherit

  build-shiba:
    name: "shiba (Pixel 8)"
    uses: ./.github/workflows/release-single.yaml
    with:
      device-id: shiba
      ksu-kmi: ${{ (github.event_name == 'workflow_dispatch' && inputs.ksu-kmi) || '' }}
      lenient-check: true
    secrets: inherit

  build-husky:
    name: "husky (Pixel 8 Pro)"
    uses: ./.github/workflows/release-single.yaml
    with:
      device-id: husky
      ksu-kmi: ${{ (github.event_name == 'workflow_dispatch' && inputs.ksu-kmi) || '' }}
      lenient-check: true
    secrets: inherit

  build-panther:
    name: "panther (Pixel 7)"
    uses: ./.github/workflows/release-single.yaml
    with:
      device-id: panther
      ksu-kmi: ${{ (github.event_name == 'workflow_dispatch' && inputs.ksu-kmi) || '' }}
      lenient-check: true
    secrets: inherit

  build-cheetah:
    name: "cheetah (Pixel 7 Pro)"
