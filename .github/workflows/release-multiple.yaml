name: 自动构建多设备 OTA

on:
  schedule:
    # 每日 UTC 02:00 = 北京时间 10:00
    - cron: '0 2 * * *'

  workflow_dispatch:
    inputs:
      ksu-version:
        description: KernelSU 版本（留空或 latest 则自动检测）
        required: false
        default: ''
      ksu-kmi:
        description: KernelSU KMI（留空则从 boot.img 自动检测）
        required: false
        default: ''
      force-build:
        description: 强制重新构建（即使已存在）
        type: boolean
        required: false
        default: false
      upload-test-ota:
        description: 上传到 test 目录
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-tokay-ksu:
    name: "tokay (Pixel 9) — KernelSU"
    uses: ./.github/workflows/release-single.yaml
    with:
      device-id: tokay
      magisk-preinit-device: sda10
      ksu-version: ${{ (github.event_name == 'workflow_dispatch' && inputs.ksu-version) || 'latest' }}
      ksu-kmi: ${{ (github.event_name == 'workflow_dispatch' && inputs.ksu-kmi) || '' }}
    secrets: inherit

  build-caiman-ksu:
    name: "caiman (Pixel 9 Pro) — KernelSU"
    uses: ./.github/workflows/release-single.yaml
    with:
      device-id: caiman
      magisk-preinit-device: sda10
      ksu-version: ${{ (github.event_name == 'workflow_dispatch' && inputs.ksu-version) || 'latest' }}
      ksu-kmi: ${{ (github.event_name == 'workflow_dispatch' && inputs.ksu-kmi) || '' }}
    secrets: inherit

  build-komodo-ksu:
    name: "komodo (Pixel 9 Pro XL) — KernelSU"
    uses: ./.github/workflows/release-single.yaml
    with:
      device-id: komodo
      magisk-preinit-device: sda10
      ksu-version: ${{ (github.event_name == 'workflow_dispatch' && inputs.ksu-version) || 'latest' }}
      ksu-kmi: ${{ (github.event_name == 'workflow_dispatch' && inputs.ksu-kmi) || '' }}
    secrets: inherit

  build-shiba-ksu:
    name: "shiba (Pixel 8) — KernelSU"
    uses: ./.github/workflows/release-single.yaml
    with:
      device-id: shiba
      magisk-preinit-device: sda10
      ksu-version: ${{ (github.event_name == 'workflow_dispatch' && inputs.ksu-version) || 'latest' }}
      ksu-kmi: ${{ (github.event_name == 'workflow_dispatch' && inputs.ksu-kmi) || '' }}
    secrets: inherit

  build-husky-ksu:
    name: "husky (Pixel 8 Pro) — KernelSU"
    uses: ./.github/workflows/release-single.yaml
    with:
      device-id: husky
      magisk-preinit-device: sda10
